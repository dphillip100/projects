<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">

            <div class="team">
                <h3 class="team-name">HOME</h3>
                <h4 class="score" id="home-team-score"></h4>
                <div class="point-clickers">
                    <button class="btn" onclick="home1Point()">+1</button>
                    <button class="btn" onclick="home2Points()">+2</button>
                    <button class="btn" onclick="home3Points()">+3</button>
                </div>
            </div>

            <div class="options">
                <button class="btn" onclick="newGame()">New Game</button>
            </div>

            <div class="team">
                <h3 class="team-name">AWAY</h3>
                <h4 class="score" id="guest-team-score"></h4>
                <div class="point-clickers">
                    <button class="btn" onclick="guest1Point()">+1</button>
                    <button class="btn" onclick="guest2Points()">+2</button>
                    <button class="btn" onclick="guest3Points()">+3</button>
                </div>
            </div>

        </div>
        <script src="index.js"></script>
    </body>
</html>
